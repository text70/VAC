version: "3.9"

services:
  rust-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "28015:28015/udp"   # Game
      - "28082:28082/tcp"   # RCON/App
      - "28084:28084/tcp"   # VAC daemon listener (client scan results)
    volumes:
      - rust-server-data:/server/server
      - /etc/vac/keys:/server/vac-extra:ro
    devices:
      - /dev/vac:/dev/vac
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  rust-server-data:
